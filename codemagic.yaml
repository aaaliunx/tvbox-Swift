# Codemagic：无 Mac 环境下编译未签名 iOS IPA
workflows:
  ios-build:
    name: Build Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_VERSION: "16.0"
    scripts:
      - name: 生成 Xcode 工程
        script: |
          which xcodegen || brew install xcodegen
          xcodegen generate
          xcodebuild -list -project tvbox.xcodeproj
      - name: 编译 Archive（不签名）
        script: |
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme tvbox \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/tvbox.xcarchive \
            CODE_SIGNING_ALLOWED=NO
      - name: 打包未签名 IPA（标准 Payload 结构）
        script: |
          set -e
          APP_PATH="build/tvbox.xcarchive/Products/Applications/TVBox.app"
          test -d "$APP_PATH" || { echo "未找到 TVBox.app"; exit 1; }
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -q -r -y ../../TVBox-unsigned.ipa Payload/
          cd ../..
          ls -lh TVBox-unsigned.ipa
    artifacts:
      - TVBox-unsigned.ipa
      - build/tvbox.xcarchive/Products/Applications/TVBox.app/**/*.dSYM
    publishing:
      email:
        recipients:
          - example@example.com
