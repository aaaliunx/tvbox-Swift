# CircleCI：无 Mac 环境下编译未签名 iOS IPA（macOS executor）
version: 2.1

jobs:
  build-ipa:
    macos:
      xcode: "16.0.0"
    working_directory: ~/tvbox-swift
    steps:
      - checkout
      - run:
          name: 生成工程
          command: |
            which xcodegen || brew install xcodegen
            xcodebuild -version
            xcodegen generate
            xcodebuild -list -project tvbox.xcodeproj
      - run:
          name: 编译 Archive（不签名）
          command: |
            xcodebuild archive \
              -project tvbox.xcodeproj \
              -scheme tvbox \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/tvbox.xcarchive \
              CODE_SIGNING_ALLOWED=NO
      - run:
          name: 打包未签名 IPA（标准 Payload 结构）
          command: |
            set -e
            APP_PATH="build/tvbox.xcarchive/Products/Applications/TVBox.app"
            test -d "$APP_PATH" || { echo "未找到 TVBox.app"; exit 1; }
            rm -rf build/ipa
            mkdir -p build/ipa/Payload
            cp -R "$APP_PATH" build/ipa/Payload/
            cd build/ipa
            zip -q -r -y ../../TVBox-unsigned.ipa Payload/
            cd ../..
            ls -lh TVBox-unsigned.ipa
      - store_artifacts:
          path: TVBox-unsigned.ipa
          destination: tvbox-ios-unsigned

workflows:
  version: 2
  build:
    jobs:
      - build-ipa
